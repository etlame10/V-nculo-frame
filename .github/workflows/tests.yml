name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS Bookworm; 3.13 = Raspberry Pi OS Trixie.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev,display]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Pruebas
        # Sin pantalla física: SDL usa su controlador vacío.
        env:
          SDL_VIDEODRIVER: dummy
        run: pytest

  db:
    # Migraciones y RLS en un PostgreSQL normal con una imitación mínima de
    # Supabase (scripts/test_db.sh). Rápida y sin Docker.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-pgtap
      - name: Migraciones y pruebas pgTAP
        run: ./scripts/test_db.sh

  supabase:
    # Prueba de referencia: las mismas migraciones y pruebas con la CLI oficial
    # de Supabase en local (Docker). No se conecta a ningún proyecto remoto.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Base de datos local de Supabase
        run: supabase db start
      - name: Pruebas pgTAP
        run: supabase test db
      - name: Webhook de Telegram de extremo a extremo (sin bot real)
        run: ./scripts/test_functions_e2e.sh

  functions:
    # Edge Function del bot: formato, lint, tipos y pruebas con dobles.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supabase/functions/telegram-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno fmt --check
      - run: deno lint
      - run: deno check *.ts
      - name: Pruebas
        run: deno test -A
